<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic Development Index social preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 640px; margin: 0; }
    body {
      overflow: hidden;
      color: #f4f1f8;
      background:
        linear-gradient(rgba(126, 255, 181, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(126, 255, 181, 0.07) 1px, transparent 1px),
        #15111c;
      background-size: 32px 32px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      padding: 72px 80px 64px;
    }
    main::before {
      content: "";
      position: absolute;
      inset: 24px;
      border: 1px solid #41394c;
      pointer-events: none;
    }
    .eyebrow {
      color: #65f59b;
      font: 700 20px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    h1 {
      max-width: 1030px;
      margin: 22px 0 24px;
      font-size: 72px;
      line-height: 0.98;
      letter-spacing: 0;
    }
    .promise {
      max-width: 920px;
      margin: 0;
      color: #c8c0d1;
      font-size: 29px;
      line-height: 1.4;
      letter-spacing: 0;
    }
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }
    .categories {
      display: flex;
      gap: 14px;
    }
    .categories span {
      padding: 10px 16px;
      border: 1px solid #4b4357;
      background: #1d1725;
      color: #e4dde9;
      font: 700 18px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .owner {
      color: #8f8798;
      font: 600 19px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="eyebrow">Evidence-backed reference</div>
      <h1>Agentic Development Index</h1>
      <p class="promise">Formats, guides, and tools for durable agent context.</p>
    </section>
    <footer>
      <div class="categories">
        <span>Formats</span>
        <span>Learn</span>
        <span>Tools</span>
      </div>
      <div class="owner">devspecs-com / GitHub</div>
    </footer>
  </main>
</body>
</html>
